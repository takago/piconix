<!doctype html>
<html><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
button{padding:12px;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
input{width:100%}#value{display:inline-block;width:5em}
</style>
<h3>PicoNIX PWM</h3><a href="/">Home</a>
<h4>Servo GP19</h4>
50 Hz <input id="pulse" type="range" min="0.7" max="2.3" step="0.02" value="1.5">
<span id="value">1.50 ms</span> <button id="servo">Start</button>
<h4>Buzzer GP18</h4>
<div id="keys"></div><p id="status"></p>
<script>
const $=s=>document.getElementById(s),hz=[262,294,330,349,392,440,494,523];
let on=0,note=-1,queue=Promise.resolve(),tick=0;
function send(path,v){
 queue=queue.then(async()=>{
  let r=await fetch('/api/'+path,{method:'POST',body:''+v});
  if(!r.ok)throw Error(r.status);
  $('status').textContent='';
 }).catch(e=>{$('status').textContent=e.message});
}
function pwm(p,v){send('pwm/'+p,v)}
function off(){pwm('a',0);pwm('b',0)}
function servoStop(){on=0;$('servo').textContent='Start';pwm('b',0)}
function width(){pwm('b',(+$('pulse').value*5).toFixed(1))}
$('pulse').oninput=()=>{
 $('value').textContent=(+$('pulse').value).toFixed(2)+' ms';
 if(on&&Date.now()-tick>100){tick=Date.now();width()}
};
$('pulse').onchange=()=>{if(on)width()};
$('servo').onclick=()=>{
 if(on){servoStop();return}
 note=-1;on=1;$('servo').textContent='Stop';
 off();pwm('freq',50);width();
};
'C D E F G A B C'.split(' ').forEach((s,i)=>{
 let b=document.createElement('button');b.textContent=s;
 b.onpointerdown=e=>{
  e.preventDefault();b.setPointerCapture(e.pointerId);
  if(on)servoStop();
  note=i;send('tone',hz[i]);
 };
 b.onpointerup=b.onpointercancel=()=>{
  if(note===i){note=-1;send('tone',0)}
 };
 $('keys').append(b);
});
</script></html>
